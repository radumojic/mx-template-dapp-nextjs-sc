allowBuilds:
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-svg-core': false
  '@fortawesome/free-solid-svg-icons': false
  '@parcel/watcher': false
  '@swc/core': false
  bufferutil: false
  cypress: false
  esbuild: false
  keccak: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@multiversx/*'
overrides:
  # sdk-dapp-form (via sdk-dapp-sc-explorer) pins react-tooltip 5.7.2, whose ESM
  # bundle inlines React dev internals and crashes on load under Next 16 with
  # "Cannot read properties of undefined (reading 'ReactDebugCurrentFrame')".
  # Later 5.x releases dropped that vendored code.
  react-tooltip: 5.29.1
